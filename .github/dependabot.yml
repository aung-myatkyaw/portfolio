version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      frontend-deps:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss"
          - "framer-motion"
          - "@marsidev/*"
          - "@fontsource/*"
          - "@emailjs/*"
      icp-sdk:
        patterns:
          - "@icp-sdk/*"
          - "@dfinity/*"
      dev-tools:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "globals"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      icp-rust:
        patterns:
          - "ic-cdk*"
          - "candid"
